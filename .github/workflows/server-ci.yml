name: RPFM Server Docker
on:
  pull_request:
    paths:
      - 'server/**'
      - 'action.yml'
      - 'README.md'
      - '.github/workflows/server-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test upstream update tooling
        run: python3 -m unittest discover -s server/tests -v
      - name: Read pinned version
        id: version
        run: python3 server/upstream.py version --output "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build the server image (without publishing)
        uses: docker/build-push-action@v7.4.0
        with:
          context: server
          load: true
          push: false
          tags: local/rpfm-server:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=rpfm-server
          cache-to: type=gha,mode=max,scope=rpfm-server
      - name: Start RPFM for this job
        id: rpfm
        uses: ./
        with:
          image: local/rpfm-server:${{ steps.version.outputs.version }}
      - name: Run MCP smoke test
        run: |
          python3 server/smoke_test.py --roundtrip
      - name: Container logs and cleanup
        if: always()
        env:
          RPFM_CONTAINER: ${{ steps.rpfm.outputs.container }}
        run: |
          if [[ -n "${RPFM_CONTAINER}" ]]; then
            docker logs "${RPFM_CONTAINER}" || true
            docker rm --force "${RPFM_CONTAINER}" || true
          fi

  bundled-root-action:
    name: Root action without a prebuilt image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read pinned version
        id: version
        run: python3 server/upstream.py version --output "$GITHUB_OUTPUT"
      # Deliberately omit `with.image` and any separate image build. This must
      # exercise the root action's manifest lookup and bundled Docker context.
      - name: Build and start through the root action
        id: rpfm
        uses: ./
      - name: Verify the default-built server and pack disk roundtrip
        env:
          RPFM_URL: ${{ steps.rpfm.outputs.url }}
          RPFM_MCP_URL: ${{ steps.rpfm.outputs.mcp-url }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$RPFM_MCP_URL" = "$RPFM_URL/mcp"
          python3 server/smoke_test.py --url "$RPFM_URL" --expected-version "$VERSION" --roundtrip
      - name: Container logs and cleanup
        if: always() && steps.rpfm.outputs.container != ''
        env:
          RPFM_CONTAINER: ${{ steps.rpfm.outputs.container }}
        run: |
          docker logs "$RPFM_CONTAINER" || true
          docker rm --force "$RPFM_CONTAINER" || true

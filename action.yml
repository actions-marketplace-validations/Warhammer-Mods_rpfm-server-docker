name: RPFM Server Docker
description: Download and start a verified RPFM Server image for MCP and WebSocket pack operations.
branding:
  icon: 'package'
  color: 'orange'
inputs:
  image:
    description: Optional custom registry image or local image. Defaults to the release's verified GHCR digest.
    required: false
    default: ''
  build-from-source:
    description: Build the bundled Dockerfile instead of downloading the release image.
    required: false
    default: 'false'
  port:
    description: Localhost port on the runner.
    required: false
    default: '45127'
outputs:
  url:
    description: Base HTTP URL for this job.
    value: ${{ steps.start.outputs.url }}
  mcp-url:
    description: Streamable HTTP MCP endpoint.
    value: ${{ steps.start.outputs.mcp-url }}
  container:
    description: Container name; remove it in an always() cleanup step.
    value: ${{ steps.start.outputs.container }}
  image:
    description: Image reference used to start this job (a digest for the default GHCR path).
    value: ${{ steps.start.outputs.image }}
runs:
  using: composite
  steps:
    - name: Download or build and start RPFM
      id: start
      shell: bash
      env:
        RPFM_ACTION_PATH: ${{ github.action_path }}/server
        RPFM_INPUT_IMAGE: ${{ inputs.image }}
        RPFM_BUILD_FROM_SOURCE: ${{ inputs.build-from-source }}
        RPFM_INPUT_PORT: ${{ inputs.port }}
      run: bash "${RPFM_ACTION_PATH}/start.sh"

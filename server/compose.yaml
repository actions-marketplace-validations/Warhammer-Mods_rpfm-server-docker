services:
  rpfm:
    image: ${RPFM_IMAGE:-ghcr.io/warhammer-mods/rpfm-server-docker:5.3.3-server.1}
    platform: linux/amd64
    ports:
      - "127.0.0.1:45127:45128"
    volumes:
      - rpfm-config:/config
      - ./work:/work
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true

volumes:
  rpfm-config:
